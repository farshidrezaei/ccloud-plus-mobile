name: Build and Release CCloud+

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release for (e.g., v2.0.0)'
        required: true
        default: 'v2.0.0'

jobs:
  build:
    name: Build & Release Android APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Scripts Executable
        run: |
          chmod +x gradlew
          if [ -d "scripts" ]; then
            chmod +x scripts/*.sh || true
          fi

      - name: Setup Keystore
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEY_STORE_BASE64" ]; then
            echo "$KEY_STORE_BASE64" | base64 --decode > app/keystore.jks
            echo "storePassword=$KEY_STORE_PASSWORD" > key.properties
            echo "keyPassword=$KEY_PASSWORD" >> key.properties
            echo "keyAlias=$KEY_ALIAS" >> key.properties
            echo "storeFile=keystore.jks" >> key.properties
            echo "Keystore configured successfully."
          else
            echo "No signing keystore provided; Gradle will use debug key configuration."
          fi

      - name: Build Release APKs
        run: |
          ./gradlew assembleRelease --stacktrace -x lint

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          if [[ $GITHUB_EVENT_NAME == 'workflow_dispatch' ]]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          mkdir -p release_artifacts
          APK_DIR="app/build/outputs/apk/release"

          # Universal APK
          if [ -f "$APK_DIR/app-universal-release.apk" ]; then
            cp "$APK_DIR/app-universal-release.apk" "release_artifacts/CCloud-Plus-$TAG_NAME-universal.apk"
          elif [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" "release_artifacts/CCloud-Plus-$TAG_NAME-universal.apk"
          fi

          # ABI-specific APKs
          [ -f "$APK_DIR/app-arm64-v8a-release.apk" ] && cp "$APK_DIR/app-arm64-v8a-release.apk" "release_artifacts/CCloud-Plus-$TAG_NAME-arm64-v8a.apk"
          [ -f "$APK_DIR/app-armeabi-v7a-release.apk" ] && cp "$APK_DIR/app-armeabi-v7a-release.apk" "release_artifacts/CCloud-Plus-$TAG_NAME-armeabi-v7a.apk"
          [ -f "$APK_DIR/app-x86_64-release.apk" ] && cp "$APK_DIR/app-x86_64-release.apk" "release_artifacts/CCloud-Plus-$TAG_NAME-x86_64.apk"

          # Generate SHA-256 Checksums
          cd release_artifacts
          sha256sum *.apk > checksums.txt
          cd ..
          ls -la release_artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: CCloud+ ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            release_artifacts/*.apk
            release_artifacts/checksums.txt
          body: |
            ## 🎬 CCloud+ ${{ env.TAG_NAME }} - Mobile & Android TV

            ### ✨ What's New
            - **Cinevex Glassmorphic OLED UI**: True black aesthetic with glassmorphic cards and Netflix-inspired red accents.
            - **Featured Hero Carousel**: Auto-rotating 7s cinematic spotlight banner on Movies and Series tabs.
            - **Native Android TV Support**: Full D-pad remote navigation with glowing focus indicators and 1.08x card scaling.
            - **Next-Gen ExoPlayer Engine**: 500MB LRU disk cache for seamless scrubbing and offline playback without re-downloading.
            - **Native Picture-in-Picture (PiP)**: Keep watching in floating window mode across apps.
            - **Live Subtitle Syncer**: Real-time delay adjustment (`±0.1s` to `±1.0s`) and custom `.srt` file loader.
            - **Binge Auto-Next**: 15-second floating countdown banner to automatically play next episode.
            - **Anti-Sanction DNS Switcher**: In-app DoH presets (Shecan, 403.online, Electro, Radar, Cloudflare).
            - **Zero-Crash Architecture**: Global crash guard and defensive JSON parser.

            ---

            ### 📦 Download Options

            | Architecture | APK File | Best For |
            |:---|:---|:---|
            | **Universal** | `CCloud-Plus-${{ env.TAG_NAME }}-universal.apk` | Compatible with all devices & Android TV boxes |
            | **arm64-v8a** | `CCloud-Plus-${{ env.TAG_NAME }}-arm64-v8a.apk` | Modern 64-bit phones & tablets (Smaller file size) |
            | **armeabi-v7a** | `CCloud-Plus-${{ env.TAG_NAME }}-armeabi-v7a.apk` | Older 32-bit devices & budget TV sticks |
            | **x86_64** | `CCloud-Plus-${{ env.TAG_NAME }}-x86_64.apk` | Android Emulators & ChromeOS |

            ---

            ### 🔒 Integrity Check
            All release binaries are accompanied by `checksums.txt` containing SHA-256 digests.
